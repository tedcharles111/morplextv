<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moreplex TV - Entertainment with Sheer Delight</title>
    <meta name="description" content="Moreplex TV Direct To Home (DTH) platform. Buy decoders, subscribe to plans, and enjoy premium entertainment." />
    <style>
      @keyframes swing {
        0% { transform: rotate(-2deg); }
        50% { transform: rotate(2deg); }
        100% { transform: rotate(-2deg); }
      }
      @keyframes slideInLeft {
        from {
          opacity: 0;
          transform: translateX(-100px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }
      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(50px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes kenBurns {
        0% { transform: scale(1); }
        100% { transform: scale(1.1); }
      }
      .animate-swing {
        display: inline-block;
        animation: swing 4s ease-in-out infinite;
        transform-origin: top center;
      }
      .animate-slide-in-left {
        animation: slideInLeft 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-slide-in-up {
        animation: slideInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        opacity: 0;
      }
      .animate-ken-burns {
        animation: kenBurns 20s ease-out forwards;
      }
    </style>
    <script>
      // Polyfill process.env for browser environments to prevent ReferenceError crashes
      // when accessing process.env.API_KEY in the SDK.
      window.process = window.process || { env: {} };
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {

        }
      }
    </script>
